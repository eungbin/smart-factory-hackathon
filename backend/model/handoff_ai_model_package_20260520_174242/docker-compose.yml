services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: factory_pipeline_postgres
    environment:
      POSTGRES_DB: factory_pipeline
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
    ports:
      - "5432:5432"
    volumes:
      - factory_pipeline_pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  factory_pipeline_pg:

