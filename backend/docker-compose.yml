services:
  api:
    build:
      context: .
    container_name: gongjang-api
    restart: unless-stopped
    environment:
      APP_NAME: Gongjangjigi API
      APP_ENV: local
      DATABASE_URL: postgresql://gongjang:gongjang@postgres:5432/gongjang
      DB_CONNECT_TIMEOUT_SECONDS: 5
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      WORK_ORDER_GENERATOR_PROVIDER: ${WORK_ORDER_GENERATOR_PROVIDER:-template}
      WORK_ORDER_GENERATOR_FALLBACK_PROVIDER: ${WORK_ORDER_GENERATOR_FALLBACK_PROVIDER:-template}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m app.db.seed_if_empty &&
             python -m app.db.seed_manuals &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    container_name: gongjang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gongjang
      POSTGRES_PASSWORD: gongjang
      POSTGRES_DB: gongjang
    ports:
      - "5432:5432"
    volumes:
      - gongjang-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gongjang -d gongjang"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gongjang-postgres-data:
